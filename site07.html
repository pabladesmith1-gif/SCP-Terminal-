const reports={orientation:{title:'Emergency orientation',text:'FACILITY STATUS: LOCKDOWN\n\nDoors require E at close range. Clearance cards are reusable. Key equipment has been redistributed among room storage points; inspect the map for room names.\n\nThe lift requires this sector’s clearance card and a restored power relay. Each relay consumes one fuse. Find the fuse in MAINTENANCE and the relay in GENERATOR.\n\nThe unregistered Observer stops while directly visible. A closed door buys only a brief delay; use it to gain distance before blinking. Space forces a blink; fatigue forces one about every seven seconds.\n\nDocuments and terminals suspend the simulation while open. Checkpoints are made when collecting critical equipment and changing sectors.'},power:{title:'Electrical isolation procedure',text:'RELAY SAFETY / ALL SECTORS\n\nSet the three toggles before installing a fuse.\n1. The backup line must remain ON.\n2. The coolant line must match backup.\n3. The bridge line must oppose coolant.\n\nPanel order: COOLANT / BRIDGE / BACKUP.\n\nNever bridge the recovered medium into the network. No experiment by Dr. Jack authorizes that connection.'},observer:{title:'Observation-dependent anomaly',text:'TEMPORARY FILE / OBS-01\n\nA pale humanoid was recovered from a room that is absent from the architectural plans. It changes position when unobserved. A working flashlight extends the distance at which its movement can be arrested.\n\nDirect sight is necessary. A wall, a closed door, or a blink breaks observation. Once active, it overrides bulkhead controls and forces doors open. Repeatedly pressing CLOSE will not hold it. Break sight around corners: it hesitates, then searches your last known position at reduced speed. After nine seconds without sight or nearby sprinting, it stops searching. Walk quietly once clear; running close to it can reveal your position.\n\nThe monitoring system insists this object has always been here. Yesterday’s backup contains no record of i ces.push(id+1);if(j>0&&!visited.has(id-n))choices.push(id-n);if(j<n-1&&!visited.has(id+n))choices.push(id+n);if(!choices.length){stack.pop();continue}const next=choices[Math.floor(rand()*choices.length)];connect(id,next);visited.add(next);stack.push(next)}for(let id=0;id<rooms.length;id++){if(id%n<n-1&&rand()<.35)connect(id,id+1);if(id+n<rooms.length&&rand()<.35)connect(id,id+n)}function add(kind,roomId,label,extra={}){const r=rooms[roomId],offsets=[[-3.1,-3], [3.1,-3],[-3.1,3],[3.1,3]],start=Math.floor(rand()*4);let x=r.x,z=r.z;for(let i=0;i<4;i++){const slot=offsets[(start+i)%4],xx=r.x+slot[0],zz=r.z+slot[1];if(!objects.some(o=>Math.hypot(o.x-xx,o.z-zz)<.8)){x=xx;z=zz;break}}const o={kind,x,z,label,room:roomId,taken:false,...extra};objects.push(o);return o}add('card',1,'LEVEL '+(index+1)+' KEYCARD',{level:index+1});add('fuse',3,'CERAMIC FUSE');add('relay',4,'SECTOR POWER RELAY');add('terminal',0,'RECEPTION TERMINAL');add('document',0,'EMERGENCY ORIENTATION',{report:'orientation'});add('document',3,'ELECTRICAL ISOLATION',{report:'power'});add('document',Math.min(7,rooms.length-2),'OBSERVATION FILE',{report:'observer'});add('med',2,'MEDICAL PACK');add('battery',2,'FLASHLIGHT CELL');add('terminal',index===1?5:6,index===1?'DR. JACK’S WORKSTATION':'ARCHIVE TERMINAL');add('document',index===1?5:6,'RESEARCH MEMORANDUM',{report:index===0?'jack1':index===1?'jack2':'final'});if(index===2)add('document',5,'PHASE RESIDUE REPORT',{report:'phase'});add(index===2?'exit':'lift',rooms.length-1,index===2?'SURFACE CONTROL':'SERVICE LIFT');if(index>0)add('return',0,'LIFT TO UPPER SECTOR');for(let id=8;id<rooms.length-1;id+=3)add(id%2?'battery':'med',id,id%2?'FLASHLIGHT CELL':'MEDICAL PACK');// Expand into reserved spacing without moving existing doors or saved items.
